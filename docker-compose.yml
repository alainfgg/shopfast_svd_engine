services:
  training-service:
    build: ./training-service
    container_name: shopfast-training
    ports:
      - "5001:5001"
    volumes:
      - ./dataset:/app/dataset
      - model_storage:/app/models
    environment:
      - DATASET_PATH=/app/dataset/events.csv
      - MODEL_DIR=/app/models

  inference-service:
    build: ./inference-service
    container_name: shopfast-inference
    ports:
      - "5002:5002"
    volumes:
      - model_storage:/app/models
    environment:
      - MODEL_PATH=/app/models/model_svd.pkl
      - TOP_SELLERS_PATH=/app/models/top_sellers.json
    depends_on:
      - training-service

  dashboard-service:
    build: ./dashboard-service
    container_name: shopfast-dashboard
    ports:
      - "8501:8501"
    environment:
      - INFERENCE_URL=http://inference-service:5002
      - TRAINING_URL=http://training-service:5001
    depends_on:
      - inference-service

volumes:
  model_storage: